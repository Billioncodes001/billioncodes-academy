name: Academy Release Checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: academy-${{ github.ref }}
  cancel-in-progress: true

env:
  WRANGLER_SEND_METRICS: 'false'
  WRANGLER_LOG_PATH: .wrangler/logs

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run test:backend
      - run: npx playwright install --with-deps chromium
      - run: node --test worker/tests/admin-ui.test.mjs
      - run: npm run test:frontend
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: academy-browser-evidence-${{ github.sha }}
          path: tests/frontend/results/
          if-no-files-found: ignore
          retention-days: 7

  mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run check
      - run: npm run export -- --max-workers 2
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ui
